name: UmrahCompanion
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  UmrahCompanion:
    type: application
    platform: iOS
    sources:
      - UmrahCompanionApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.umrahcompanion
        PRODUCT_NAME: Umrah Companion
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Umrah Companion
